name: Deploy Application

on:
  push:
    branches:
      - main

env:
  FRONTEND_IMAGE: yuvarajm1810/realtime-frontend-v1
  BACKEND_IMAGE: yuvarajm1810/realtime-backend-v1
  EC2_USER: ubuntu
  EC2_HOST: 43.205.112.177
  EC2_APP_DIR: /home/ubuntu/devops

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          set -e

          docker build \
            -t $FRONTEND_IMAGE:${{ github.sha }} \
            -t $FRONTEND_IMAGE:latest \
            ./frontend

      - name: Build backend image
        run: |
          set -e

          docker build \
            -t $BACKEND_IMAGE:${{ github.sha }} \
            -t $BACKEND_IMAGE:latest \
            ./backend

      - name: Push frontend image
        run: |
          set -e

          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest

      - name: Push backend image
        run: |
          set -e

          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest

      - name: Deploy to EC2
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" << EOF

            set -e

            cd "$EC2_APP_DIR"

            echo "Pulling latest frontend image..."
            docker compose pull frontend

            echo "Pulling latest backend image..."
            docker compose pull backend

            echo "Starting application..."
            docker compose up -d

            echo "Deployment status:"
            docker compose ps

          EOF
